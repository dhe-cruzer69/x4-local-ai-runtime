[project]
name = "x4-local-ai-runtime"
version = "0.1.0"
description = "Local-first model runtime with hardware-aware routing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
x4-ai = "x4_local_ai.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
